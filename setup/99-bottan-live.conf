# botたんの配信ホスト向けカーネル設定。
# sudo bash setup/install_units.sh が /etc/sysctl.d/99-bottan-live.conf へ配置する。

# 既定の 60 だと、ollama(9.4GB)・ARDY・Unity・VOICEVOX が同居するこのホストでは
# OBS のページまでスワップへ追い出される。2026-09-08 の実測で OBS 自身が
# 947MB スワップアウトしていて、配信開始でエンコーダを作るときにページインを
# 待たされていた（x264 の初期化から libfdk_aac の生成まで20秒、
# StartStream から配信開始まで 28.6秒）。描画スレッドも 33ms に間に合わなくなり、
# 出力フレームが 37秒で3枚しか出ないまま YouTube に切られた。
#
# OBS 起動時の空き RAM と描画落ちの相関（~/.var/app/com.obsproject.Studio の
# ログを集計）:
#   503MB  → lagged frames 96.7%（21分間ずっと）
#   1.8GB  → 0.1〜0.3% と 26.2%/68.5% が混在
#   1.7GB  → 0.0〜0.3%（1時間走りきった回が7本）
#
# 0 にはしない。本当に足りなくなったときに OOM killer で配信ごと殺されるより、
# 使われていないページを退かせたほうがよい。
vm.swappiness = 10
