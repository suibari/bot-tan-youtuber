# ollama の drop-in。/etc/systemd/system/ollama.service.d/override.conf として置く。
#
#   sudo install -m644 setup/ollama-override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# **この ollama は別ホストの bsky-affirmative-bot と共用している。**
# 2026-09-02 時点で 192.168.1.200 から /api/chat が 20分に100本来る。
# ここを触ると向こうも巻き込むので、変えたら両方を見ること。
#
# GPU は RTX 5070 Ti / 16,303 MiB。内訳の実測は README.md の「VRAM の内訳」を参照。
# 収録中は Unity が Xvfb(llvmpipe) へ描くので VRAM を使わず、容量は足りている。
# 効くのは容量ではなく **runner を作り直させないこと**（下記 OLLAMA_CONTEXT_LENGTH）。

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"

# GPUにはチャットモデルだけを常駐
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NUM_PARALLEL=1"

Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# **この行が num_ctx の唯一の源。消すな。**
#
# Ollama は num_ctx が違うと同じモデルでも runner を作り直す。以前は「全クライアントが
# 同じ値を明示送信して揃える」方式で、ここと common/llm.py と bsky-affirmative-bot の
# 3箇所を人手で合わせていた。2026-09-03 に**どのクライアントも num_ctx を送らない**形へ
# 変えたので、いまは全員がこの既定に乗る。揃え忘れが起こりようがない。
#
# したがって **クライアント側に num_ctx を足してはいけない。** 1つでも送る側ができると、
# ここを下げたときにそこだけ古い値を要求し、runner が2つの ctx を往復する。
# 「サーバを直したのに直らない」いちばん読みにくい壊れ方になる。
#
# 消したときに起きること: Ollama は VRAM 依存の自動選択（4k/32k/256k）に戻る。
# 4096 を引くと botたんのペルソナだけで溢れ、**応答が空文字で返る**。例外は出ない。
#
# 2026-09-02 の実測（揃っていなかった頃）: 32768 と 4096 が交互に来て load_tensors が
# **1時間に114回**。I/O を食い切り（sar で %iowait 36% に対し %user 17%）、ARDY の生成が
# 17秒 → 129秒 → 300秒超（タイムアウト）と崩れ、朝夜の Shorts からモーションが消えた。
#
# 値を変えるときは bsky-affirmative-bot 側の OLLAMA_TEXT_CONTEXT_LENGTH も同じ値へ。
# あちらは送信用ではなくプロンプト予算の計算に使う（ズレると健康監視が
# [WARN][OLLAMA_CTX] を出す）。**先にここ、あとで向こう。**
Environment="OLLAMA_CONTEXT_LENGTH=32768"
