# ollama の drop-in。/etc/systemd/system/ollama.service.d/override.conf として置く。
#
#   sudo install -m644 setup/ollama-override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# **この ollama は別ホストの bsky-affirmative-bot と共用している。**
# 2026-09-02 時点で 192.168.1.200 から /api/chat が 20分に100本来る。
# ここを触ると向こうも巻き込むので、変えたら両方を見ること。
#
# GPU は RTX 5070 Ti / 16,303 MiB。内訳の実測は README.md の「VRAM の内訳」を参照。
# 収録中は Unity が Xvfb(llvmpipe) へ描くので VRAM を使わず、容量は足りている。
# 効くのは容量ではなく **runner を作り直させないこと**（下記 OLLAMA_CONTEXT_LENGTH）。

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"

# GPUにはチャットモデルだけを常駐
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NUM_PARALLEL=1"

Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# **common/llm.py の OLLAMA_NUM_CTX と必ず同値にすること。**
# Ollama は num_ctx が違うと同じモデルでも runner を作り直す。num_ctx を明示しない
# クライアント（OpenAI互換 /v1/chat/completions は options を黙って捨てる）が来ると
# 既定の 4096 で作り直しにいき、11GB のモデルが丸ごと読み直される。
#
# 2026-09-02 の実測: 32768 と 4096 が交互に来て load_tensors が **1時間に114回**。
# I/O を食い切り（sar で %iowait 36% に対し %user 17%）、ARDY の生成が
# 17秒 → 129秒 → 300秒超（タイムアウト）と崩れ、朝夜の Shorts からモーションが消えた。
# サーバ側の既定を揃えておけば、呼び元が誰であれ同じ runner に乗る。
Environment="OLLAMA_CONTEXT_LENGTH=32768"
