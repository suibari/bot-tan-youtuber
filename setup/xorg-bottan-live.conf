# botたんライブ配信用の GPU 付き仮想ディスプレイ。
#
# Xvfb は Mesa の llvmpipe（CPUソフトウェアラスタライザ）で描画するため、
# 1920x1080 の URP + VRM では 1.7fps しか出ず配信に使えない（実測）。
# NVIDIA ドライバでモニタ非接続の仮想スクリーンを作り、GPU で描かせる。
#
# このファイルは /etc/X11/xorg.conf.d/ には置かないこと。置くと GDM が管理する
# デスクトップ側の X 起動にも影響する。Xorg -config で明示的に読ませる。
#
# 対象GPU: NVIDIA GeForce RTX 3060 Ti (PCI 01:00.0 -> "PCI:1:0:0")

Section "ServerLayout"
    Identifier     "BottanLive"
    Screen      0  "Screen0"
    # 物理の入力デバイスを掴まない。デスクトップ側のキーボード・マウスを
    # 奪うと操作不能になる
    Option         "AutoAddDevices" "false"
    Option         "AutoAddGPU"     "false"
EndSection

Section "Files"
    # NVIDIA の X ドライバは Ubuntu では標準の modules ディレクトリではなく
    # こちらに入っている。順序が重要（先に書いたほうが優先される）
    ModulePath     "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath     "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load           "glx"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync       28.0 - 80.0
    VertRefresh     48.0 - 75.0
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:1:0:0"
    # モニタが1枚も繋がっていなくても X を起動させる。これが無いと
    # "No devices detected" で落ちる
    Option         "AllowEmptyInitialConfiguration" "true"
    # UseDisplayDevice=None の NoScanout は NVIDIA 595.84 + RTX 5070 Ti で
    # CurrentMetaMode=NULL・更新約1fpsになり、Unity OpenGL が
    # PresentContextGL で abort した。未使用の DFP-1 に実モニタから保存した
    # EDIDを割り当て、60Hzの表示クロックを持つ仮想出力として扱う。
    Option         "ConnectedMonitor" "DFP-1"
    Option         "CustomEDID" "DFP-1:/etc/X11/bottan-live.edid"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    # 物理端子には何も繋がないが、上のダミーEDIDを持つ出力へ描画する。
    Option         "UseDisplayDevice" "DFP-1"
    Option         "MetaModes" "DFP-1: 2560x1440_60 +0+0"
    SubSection     "Display"
        Depth       24
        # 配信解像度は 1920x1080 だが、仮想画面はそれより大きく取る。
        #
        # OBS がキャプチャするのは Unity Editor のウィンドウで、Game View を
        # 最大化してもメニューバー・ツールバー・ステータスバーぶん（上下で
        # 約150px）は残る。画面が 1920x1080 ちょうどだと Game View の表示領域が
        # 1660x930 まで縮み、Unity 側で 0.87倍に縮小されたものを OBS が
        # 1920x1080 へ引き伸ばし直すことになる（実測 Scale 0.87x）。
        #
        # 2560x1440 にしておけば Game View の表示領域が 1920x1080 を上回るので
        # Unity は等倍（1x）で表示し、OBS は切り抜くだけで済む。モニタは
        # 繋がっていないので解像度を上げる実害はない。
        Virtual     2560 1440
    EndSubSection
EndSection
