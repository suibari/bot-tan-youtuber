# botたんライブ配信用の GPU 付き仮想ディスプレイ。
#
# Xvfb は Mesa の llvmpipe（CPUソフトウェアラスタライザ）で描画するため、
# 1920x1080 の URP + VRM では 1.7fps しか出ず配信に使えない（実測）。
# NVIDIA ドライバでモニタ非接続の仮想スクリーンを作り、GPU で描かせる。
#
# このファイルは /etc/X11/xorg.conf.d/ には置かないこと。置くと GDM が管理する
# デスクトップ側の X 起動にも影響する。Xorg -config で明示的に読ませる。
#
# 対象GPU: NVIDIA GeForce RTX 5070 Ti (PCI 01:00.0 -> "PCI:1:0:0")
#
# この PC の GPU はこの1枚きり。i5-12400F は F 付きで内蔵 GPU を持たないので、
# デスクトップの Xorg (:0) と配信の Xorg (:99) は同じ GPU を共有する。
# 共存できるのは :99 がスキャンアウトを持たないうちだけ（Screen セクション参照）。

Section "ServerLayout"
    Identifier     "BottanLive"
    Screen      0  "Screen0"
    # 物理の入力デバイスを掴まない。デスクトップ側のキーボード・マウスを
    # 奪うと操作不能になる
    Option         "AutoAddDevices" "false"
    Option         "AutoAddGPU"     "false"
EndSection

Section "Files"
    # NVIDIA の X ドライバは Ubuntu では標準の modules ディレクトリではなく
    # こちらに入っている。順序が重要（先に書いたほうが優先される）
    ModulePath     "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath     "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load           "glx"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync       28.0 - 80.0
    VertRefresh     48.0 - 75.0
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:1:0:0"
    # モニタが1枚も繋がっていなくても X を起動させる。これが無いと
    # "No devices detected" で落ちる
    Option         "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    # 実ディスプレイを一切使わない（NoScanout）。**ここを実スキャンアウトに
    # しないこと。** 表示デバイスを持つと X は DRM master を要求するように
    # なり、同じ GPU を使うデスクトップの Xorg (:0) と奪い合う。この PC の
    # GPU は1枚きり（i5-12400F は内蔵 GPU を持たない）なので、勝った側しか
    # 描けない。
    #
    # 8/31 の a109cff は、5070 Ti で NoScanout が約1fps になったのを受けて
    # 未使用の DFP-1 にダミーEDIDを割り当て、実スキャンアウトを持たせていた。
    # 1fps は直ったが、代わりにデスクトップとの競合が生まれ、
    #   - デスクトップが master を握ると :99 は 1fps へ落ちる（9/10 の配信事故）
    #   - その状態で入れ直すと "Failed to acquire modesetting permission"
    #     で起動すらできない（9/11 21:40）
    # という壊れ方をするようになった。3060 Ti 時代（8/24〜8/28）は NoScanout で
    # デスクトップと共存し、5晩とも丸一時間 60fps で完走している。
    #
    # **8/31 が見た 1fps の正体は vsync 待ちだった。** NoScanout には表示クロックが
    # 無いので、vblank を待つ GL クライアントは描けていても 1fps に見える。Unity にも
    # glxgears にも __GL_SYNC_TO_VBLANK=0 は渡っておらず、8/31 の判断はそれを
    # 試さないまま下していた。渡す係は live/unity_live.py と setup/reset_display.sh。
    #
    # **ただし NoScanout に戻すだけでは足りない。** :99 は gdm より後に起動して
    # いないと、GPU が空いていても描画を締め出されて 1.0fps に張り付く。
    # 配信の直前に作り直す係が bottan-live-display.service。
    # 詳細は docs/investigations/2026-09-11-display-starvation.md
    Option         "UseDisplayDevice" "None"
    SubSection     "Display"
        Depth       24
        # 配信解像度は 1920x1080 だが、仮想画面はそれより大きく取る。
        #
        # OBS がキャプチャするのは Unity Editor のウィンドウで、Game View を
        # 最大化してもメニューバー・ツールバー・ステータスバーぶん（上下で
        # 約150px）は残る。画面が 1920x1080 ちょうどだと Game View の表示領域が
        # 1660x930 まで縮み、Unity 側で 0.87倍に縮小されたものを OBS が
        # 1920x1080 へ引き伸ばし直すことになる（実測 Scale 0.87x）。
        #
        # 2560x1440 にしておけば Game View の表示領域が 1920x1080 を上回るので
        # Unity は等倍（1x）で表示し、OBS は切り抜くだけで済む。モニタは
        # 繋がっていないので解像度を上げる実害はない。
        Virtual     2560 1440
    EndSubSection
EndSection
